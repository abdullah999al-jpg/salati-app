function category(id){return DATA.groups.find(g=>g.ids.includes(id))?.name||'التعلّم'}
function getModule(id){return DATA.modules.find(m=>m.id===id)}
function header(){let tabs=[['home','الرئيسية','home'],['library','الأقسام','grid'],['steps','صفة الصلاة','play'],['quiz','الاختبار','check']];return `<header class="topbar"><div class="container topinner"><button class="brand" onclick="navTo('home')" aria-label="صلاتي - الرئيسية"><span class="brandlogo">${icon('book')}</span><span class="brandtxt"><b>صلاتي</b><small>تعلّم وأتقن</small></span></button><nav class="desktopnav" aria-label="التنقل الرئيسي">${tabs.map(([id,t,ic])=>`<button class="${state.view===id?'active':''}" onclick="navTo('${id}')">${icon(ic)}${t}</button>`).join('')}</nav><div class="topend"><span class="tagpreview">نسخة تجريبية</span><button class="tinyaction" onclick="openMedia()" aria-label="إدارة الصور والأصوات" title="الوسائط">${icon('headphones')}</button></div></div></header>`}
function bottomNav(){let tabs=[['home','الرئيسية','home'],['library','الأقسام','grid'],['steps','صفة الصلاة','play'],['quiz','اختبر نفسك','check']];return `<nav class="bottomnav" aria-label="القائمة السفلية">${tabs.map(([id,t,ic])=>`<button aria-label="${t}" class="${state.view===id?'active':''}" onclick="navTo('${id}')">${icon(ic)}<span>${t}</span></button>`).join('')}</nav>`}
function moduleCard(m,cls=''){return `<button class="topiccard ${cls}" data-color="${m.color}" onclick="openModule('${m.id}')"><div class="topichead"><span class="topicicon">${icon(m.icon)}</span><span class="topiccount">${m.count}</span></div><h3>${m.name}</h3><p>${m.sub}</p><div class="topicbottom"><span>استعرض الدرس</span>${icon('arrow')}</div></button>`}
function openModule(id){if(id==='howto'){navTo('steps');return}navTo('module',id)}
function groupedCards(groups){return groups.map(g=>`<section><div class="groupheading"><span class="dot"></span><h3>${g.name}</h3><small>${g.subtitle}</small></div><div class="topicgrid">${g.ids.map(id=>moduleCard(getModule(id))).join('')}</div></section>`).join('')}
function home(){return `<section class="hero"><div class="herocopy"><div class="herolabel">من المعرفة إلى التطبيق</div><h1>صلاتك تبدأ <span>بالمعرفة</span></h1><p>تعلّم صفة الصلاة بالصور الحقيقية، وافهم شروطها وأركانها وواجباتها بطريقة سهلة وخطوة بخطوة.</p><div class="herobuttons"><button class="btn gold" onclick="navTo('steps')">ابدأ تعلّم الصلاة ${icon('arrow')}</button><button class="btn white" onclick="navTo('library')">استكشف الأقسام</button></div></div><div class="heroart"><span class="archback"></span><div class="heroarch"><img src="${DATA.assets.qiyam}" alt="صورة تعليمية حقيقية للقيام في الصلاة من الكتاب"></div><div class="herofloat">✦ <span>تعلّم · طبّق · أتقن</span></div></div></section>
<div class="introstrip"><div class="introstat"><span class="statglyph">${icon('grid')}</span><div><b>٩</b><small>أقسام تعليمية</small></div></div><div class="introstat"><span class="statglyph">${icon('layers')}</span><div><b>١١</b><small>خطوة تعليمية</small></div></div><div class="introstat"><span class="statglyph">${icon('award')}</span><div><b>${state.visited.length} / ١١</b><small>خطوات زرتها</small></div></div></div>
<div class="sectiontitle"><div><span class="overline">ابدأ من هنا</span><h2>رحلتك مع الصلاة</h2><p>تعلم بصورة واضحة ثم اختبر معلوماتك.</p></div></div>
<div class="featuregrid"><button class="feature primaryfeature" onclick="navTo('steps')"><div class="featuretext"><small>التعلّم المصوّر</small><h3>صفة الصلاة</h3><p>انتقل بين الخطوات، وشاهد الصور وأذكار الصلاة.</p><span class="go">${state.visited.length?'أكمل تعلّمك':'ابدأ التعلّم'} ${icon('arrow')}</span></div><img class="featurephoto" src="${DATA.assets.sujud}" alt="هيئة السجود في الصلاة"></button><button class="feature quizfeature" onclick="navTo('quiz')"><div class="featuretext"><small>تحدَّ معلوماتك</small><h3>اختبر نفسك</h3><p>أسئلة تفاعلية وتصحيح فوري يوضح سبب الإجابة.</p><span class="go">ابدأ الاختبار ${icon('arrow')}</span></div><span class="bigicon">${icon('award')}</span></button></div>
<div class="sectiontitle"><div><span class="overline">مكتبة صلاتي</span><h2>اختر ما تريد تعلّمه</h2><p>أقسام مرتبة بحسب رحلة الطالب.</p></div><button class="textlink" onclick="navTo('library')">عرض جميع الأقسام ${icon('arrow')}</button></div>
${groupedCards(DATA.groups)}<div class="sourcefoot">${icon('book')}<span>المحتوى التعليمي مستمد من المراجع المدرسية المرفقة. لكل درس رقم صفحته، والصور مأخوذة من صفحات المرجع.</span></div>`}
function library(){let filt=state.group;let gs=DATA.groups.map(g=>({...g,ids:g.ids.filter(id=>(filt==='all'||g.id===filt)&&((getModule(id).name+' '+getModule(id).sub).includes(state.search.trim())))})).filter(g=>g.ids.length);return `<div class="screenhead"><span class="pageeyebrow">المكتبة التعليمية</span><h1>جميع دروس الصلاة</h1><p>ابحث عن الدرس، أو اختر القسم الذي تريد مراجعته.</p></div><label class="searchbox">${icon('search')}<input id="courseSearch" type="search" placeholder="ابحث عن درس..." autocomplete="off" value="${escapeHTML(state.search)}" oninput="setSearch(this.value)" aria-label="البحث عن الدروس"></label><div class="filters">${[['all','الكل'],['before','قبل الصلاة'],['practice','تعلّم الصلاة'],['review','المراجعة والسهو']].map(([v,t])=>`<button class="filter ${state.group===v?'active':''}" onclick="setGroup('${v}')">${t}</button>`).join('')}</div><div id="library-results">${libraryResults(gs)}</div>`}
function libraryResults(gs){return gs.length?gs.map(g=>`<div class="groupheading"><span class="dot"></span><h3>${g.name}</h3><small>${g.subtitle}</small></div><div class="librarylist">${g.ids.map(id=>moduleCard(getModule(id))).join('')}</div>`).join(''):'<div class="detailbox"><h2>لا توجد نتائج</h2><p class="muted">جرّب كتابة كلمة أخرى أو اختيار «الكل».</p></div>'}
function setSearch(v){state.search=v;let gs=DATA.groups.map(g=>({...g,ids:g.ids.filter(id=>(state.group==='all'||g.id===state.group)&&((getModule(id).name+' '+getModule(id).sub).includes(v.trim())))})).filter(g=>g.ids.length);let r=qs('#library-results');if(r)r.innerHTML=libraryResults(gs)}
function setGroup(g){state.group=g;render();qs('#courseSearch')?.focus()}
const galleryKeys=[['qiyam','القيام'],['takbir','تكبيرة الإحرام'],['ruku','الركوع'],['sujud','السجود'],['jalsa','الجلسة بين السجدتين'],['sitting','جلسة التشهد'],['tasleem','التسليم']];
function modulePage(){let m=getModule(state.module);let related=['pillars','obligations','sunnah'].includes(m.id);return `<button class="backbtn" onclick="navTo('library')">${icon('arrow')} عودة إلى الأقسام</button><div class="detailhero"><span class="tag">${category(m.id)} · ${m.count}</span><h1>${m.name}</h1><p>${m.intro}</p><div class="source">المرجع المطبوع: ${m.src}</div></div><div class="detaillayout"><section class="detailbox"><h2>محتوى الدرس</h2><div class="numberlist">${m.items.map((t,i)=>`<div class="numberitem"><span class="number">${i+1}</span><span>${t}</span></div>`).join('')}</div><div class="smallref">${icon('info')} هذه قائمة تعليمية موجزة، ويُرجع إلى النص الأصلي للتفاصيل والاستثناءات، وخاصة سجود السهو.</div></section><aside class="asidebox"><h3>ماذا بعد؟</h3><p>شاهد صفة الصلاة بالصور، ثم اختبر مدى فهمك للمعلومات التي تعلمتها.</p><button class="btn teal" onclick="navTo('steps')">${icon('play')} صفة الصلاة</button><button class="btn outline" onclick="navTo('quiz')">${icon('check')} اختبر نفسك</button></aside></div>${related?`<section class="gallery"><h2>شاهد الهيئات بالصور</h2><p>صور حقيقية من المرجع. انقر على الصورة للانتقال إلى الخطوة المرتبطة بها.</p><div class="gallerygrid">${galleryKeys.map(([key,name])=>`<button class="gallerycard" onclick="gotoPicture('${key}')"><img loading="lazy" src="${DATA.assets[key]}" alt="${name}"><strong>${name}</strong></button>`).join('')}</div></section>`:''}`}
function gotoPicture(k){let i=DATA.steps.findIndex(s=>s.img===k);state.step=Math.max(i,0);navTo('steps')}
function getPicture(n){return state.media['img'+n]||DATA.assets[DATA.steps[n].img]||''}
function steps(){const s=DATA.steps[state.step],n=state.step,pic=getPicture(n),recording=!!state.media['audio'+n],hasTTS=!!speech[n];return `<div class="screenhead"><span class="pageeyebrow">التعلّم التطبيقي</span><h1>صفة الصلاة خطوة بخطوة</h1><p>صورة واضحة وشرح مختصر لكل خطوة، مع أذكارها ومصدرها من المرجع.</p></div><div class="stepnav" aria-label="اختيار خطوة الصلاة">${DATA.steps.map((x,i)=>`<button class="stepnum ${i===n?'active':state.visited.includes(i)?'done':''}" onclick="setStep(${i})" title="${x.title}" aria-label="${x.title}" aria-current="${i===n?'step':'false'}">${i+1}</button>`).join('')}</div><section class="stepview"><div class="photoarea">${pic?`<span class="photolabel">صورة من المرجع المدرسي</span><img src="${pic}" alt="${s.title}">`:`<div class="prepbox"><div class="prepmark">${icon('shield')}</div><h3>الاستعداد للصلاة</h3><p>الطهارة، واجتناب النجاسة، ودخول الوقت، وستر العورة، واستقبال القبلة، والنية.</p></div>`}</div><div class="stepdetail"><div class="progressline"><span>تقدّم التعلّم</span><span>الخطوة ${n+1} من ${DATA.steps.length}</span></div><div class="track"><span style="width:${(n+1)*100/DATA.steps.length}%"></span></div><span class="stepcategory">${s.tag}</span><h2>${s.title}</h2><p class="stepdesc">${s.description}</p>${s.say?`<div class="chantbox"><div class="kind">الذكر أو القراءة المرتبطة بالخطوة</div><strong>${s.say}</strong><div class="audiorow">${recording?`<button class="btn light" onclick="playRecording(${n})">${icon('volume')} استمع للتسجيل البشري</button>`:hasTTS?`<button class="btn light" onclick="speak(${n})">${icon('volume')} نطق آلي تجريبي</button>`:''}<button class="btn outline" onclick="openMedia(${n})">${icon('upload')} ${recording?'تغيير التسجيل':'إضافة صوت بشري'}</button></div></div>`:''}<div class="stepnote">${s.note}</div><div class="stepactions"><button class="btn outline" onclick="setStep(${n-1})" ${n===0?'disabled':''}>السابق</button><button class="btn teal" onclick="${n===DATA.steps.length-1?"navTo('quiz')":`setStep(${n+1})`}">${n===DATA.steps.length-1?'اختبر معلوماتك':'التالي'} ${icon('arrow')}</button></div><div class="stepfoot">المرجع: ${s.page}</div></div></section><div class="sourcefoot">${icon('info')}<span>النطق الآلي متاح فقط لبعض الأذكار القصيرة، وهو ليس تسجيلًا بشريًا. لا تتوفر تلاوة بشرية معتمدة للفاتحة والتشهد حتى الآن.</span></div>`}
function quizPage(){let total=DATA.questions.length;let i=state.q;let answers=state.answers;if(i>=total){let score=Object.entries(answers).filter(([k,v])=>DATA.questions[Number(k)].right===v).length;return `<div class="quizcontainer"><div class="screenhead"><span class="pageeyebrow">الاختبار التفاعلي</span><h1>نتيجتك النهائية</h1></div><div class="quizpanel result"><div class="scorecircle">${score} / ${total}</div><h2>${score===total?'أحسنت! إجابات كاملة':'أحسنت على المحاولة!'}</h2><p>أجبت عن ${score} من أصل ${total} أسئلة إجابة صحيحة.</p><button class="btn teal" onclick="resetQuiz()">${icon('rotate')} إعادة الاختبار</button><button class="btn outline" onclick="navTo('library')">العودة إلى الدروس</button></div></div>`}let q=DATA.questions[i],chosen=answers[i],answered=chosen!==undefined;return `<div class="quizcontainer"><div class="screenhead"><span class="pageeyebrow">راجع معلوماتك</span><h1>اختبر نفسك</h1><p>اختر إجابة واحدة؛ ستعرف النتيجة وتفسيرها فورًا.</p></div><div class="quizpanel"><div class="quiztop"><span>السؤال ${i+1} من ${total}</span><span>${Math.round(i*100/total)}٪ مكتمل</span></div><div class="track"><span style="width:${i*100/total}%"></span></div><h2>${q.q}</h2><div class="answerlist">${q.opts.map((opt,j)=>`<button ${answered?'disabled':''} class="answer ${answered?(j===q.right?'correct':j===chosen?'wrong':''):''}" onclick="answerQuiz(${j})"><span>${'أبجد'[j]}</span>${opt}</button>`).join('')}</div>${answered?`<div class="feedback"><strong>${chosen===q.right?'✓ إجابة صحيحة':'الإجابة الصحيحة: '+q.opts[q.right]}</strong><p>${q.why}</p><small>المرجع: ${q.page}</small></div><div class="quiznext"><button class="btn teal" onclick="nextQuiz()">${i===total-1?'اعرض النتيجة':'السؤال التالي'} ${icon('arrow')}</button></div>`:''}</div></div>`}
function answerQuiz(a){if(state.answers[state.q]!==undefined)return;state.answers[state.q]=a;render()}
function nextQuiz(){state.q++;render()}
function resetQuiz(){state.q=0;state.answers={};render()}
function speak(n){if(!speech[n]||!('speechSynthesis' in window)){showToast('النطق الآلي غير متاح لهذه الخطوة');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(speech[n]);u.lang='ar-SA';u.rate=.78;let voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ar'));if(voices.length)u.voice=voices.find(v=>v.lang==='ar-SA')||voices[0];speechSynthesis.speak(u)}
function playRecording(n){if(!state.media['audio'+n])return;if(window._salatiAudio)window._salatiAudio.pause();window._salatiAudio=new Audio(state.media['audio'+n]);window._salatiAudio.play().catch(()=>showToast('تعذّر تشغيل هذا التسجيل على الجهاز'))}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){try{qs('#app').innerHTML=header()+`<main class="container page">${state.view==='home'?home():state.view==='library'?library():state.view==='module'?modulePage():state.view==='steps'?steps():quizPage()}</main>`+bottomNav()+`<footer class="footer"><div class="container">صلاتي | تعلّم وأتقن · نسخة تجريبية مستقلة · الأحكام الفقهية بحسب المرجعين المرفقين</div></footer>`}catch(err){console.error(err);showToast('تعذر عرض هذا القسم؛ أعد فتح الصفحة')}}
// Local media manager. These uploads are NOT published or shared with students.
function dbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('no IndexedDB'));const req=indexedDB.open('salati-attachments',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('media'))req.result.createObjectStore('media')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function loadMedia(){try{let db=await dbOpen();let tr=db.transaction('media','readonly');let store=tr.objectStore('media');let keys=Array.from({length:DATA.steps.length},(_,i)=>['imgStep_'+i,'audio_'+i]).flat();await Promise.all(keys.map(k=>new Promise(resolve=>{let r=store.get(k);r.onsuccess=()=>{if(r.result)state.media[k.startsWith('imgStep_')?'img'+k.slice(8):'audio'+k.slice(6)]=r.result;resolve()};r.onerror=()=>resolve()})));render();db.close()}catch(e){}}
async function storeMedia(k,v){let db=await dbOpen();await new Promise((resolve,reject)=>{let tr=db.transaction('media','readwrite');tr.objectStore('media').put(v,k);tr.oncomplete=resolve;tr.onerror=()=>reject(tr.error)});db.close()}
function openMedia(index=state.step){qs('#modalroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeMedia()"><section class="modal" role="dialog" aria-modal="true" aria-label="إضافة الصور والأصوات"><div class="modalheader"><h2>إدارة الوسائط</h2><button class="close" onclick="closeMedia()" aria-label="إغلاق">×</button></div><p>يمكنك إضافة صورة أو تسجيل صوتي بشري لكل خطوة. <strong>هذه الإضافات محلية في هذا المتصفح فقط</strong>، ولا تظهر لدى الطلاب بمجرد حفظها هنا.</p><label for="media-step">اختر الخطوة</label><select id="media-step">${DATA.steps.map((s,i)=>`<option value="${i}" ${i===index?'selected':''}>${i+1}. ${s.title}</option>`).join('')}</select><label for="media-image">صورة تعليمية (JPG / PNG / WebP)</label><input id="media-image" type="file" accept="image/png,image/jpeg,image/webp"><label for="media-audio">تسجيل صوت بشري (MP3 / M4A / WAV)</label><input id="media-audio" type="file" accept="audio/*"><div class="buttonrow"><button class="btn teal" onclick="saveMedia()">${icon('check')} حفظ على هذا الجهاز</button><button class="btn outline" onclick="closeMedia()">إغلاق</button></div></section></div>`}
function closeMedia(){qs('#modalroot').innerHTML=''}
function readURL(f){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}
async function saveMedia(){let n=Number(qs('#media-step').value),pic=qs('#media-image').files[0],audio=qs('#media-audio').files[0];if(!pic&&!audio){showToast('اختر صورة أو تسجيلًا صوتيًا أولًا');return}if(pic&&(pic.size>4e6||!['image/jpeg','image/png','image/webp'].includes(pic.type))){showToast('اختر صورة JPG أو PNG أو WebP بحجم أقل من ٤ ميجابايت');return}if(audio&&(audio.size>15e6||!audio.type.startsWith('audio/'))){showToast('اختر ملفًا صوتيًا صحيحًا بحجم أقل من ١٥ ميجابايت');return}try{if(pic){let u=await readURL(pic);await storeMedia('imgStep_'+n,u);state.media['img'+n]=u}if(audio){let u=await readURL(audio);await storeMedia('audio_'+n,u);state.media['audio'+n]=u}closeMedia();render();showToast('حُفظت الوسائط محليًا في هذا الجهاز')}catch(e){console.error(e);showToast('فشل الحفظ المحلي. جرّب فتح التطبيق من موقع HTTPS في Safari')}}
render(); // Never wait for IndexedDB to show the interface.
// Loading local attachments is optional and must not block the home page.
if('indexedDB' in window){let completed=false;Promise.race([loadMedia(),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),2500))]).catch(()=>{});}
</script>
</body>
</html>
